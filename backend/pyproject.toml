[project]
name = "docera-backend"
version = "0.1.0"
description = "Docera local document foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.140,<0.141",
  "uvicorn>=0.41,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.22,<0.1",
  "pypdf>=7,<8",
  "pikepdf>=10.18.0",
  "pillow>=13.0.0",
  "pypdfium2>=5.15.2",
  "pdfplumber>=0.11.10",
  "reportlab>=5.1.0",
  "python-docx>=1.2.0",
  "openpyxl>=3.1.5",
  "python-pptx>=1.0.2",
  "cryptography>=50.0.2",
  "pyhanko>=0.38.1",
  "pymupdf>=2.1",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "pip-audit>=2.10,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --basetemp=.pytest-tmp"
