name: CI Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend:
    name: Backend Lint, Security & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies (Poppler & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf tesseract-ocr tesseract-ocr-eng

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: 'latest'

      - name: Install Python dependencies
        working-directory: backend
        run: |
          uv sync --dev

      - name: Run pip-audit
        working-directory: backend
        run: |
          uv run pip-audit

      - name: Run Pytest suite
        working-directory: backend
        run: |
          uv run pytest -v

  frontend:
    name: Frontend Build, Lint & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Run npm audit
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Typecheck and Build
        run: |
          cd frontend
          npm run build

      - name: Run Vitest unit tests
        run: |
          cd frontend
          npm test

      - name: Set up Python 3.12 for E2E
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install system dependencies for E2E (Poppler & Tesseract)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils qpdf tesseract-ocr tesseract-ocr-eng

      - name: Install backend dependencies for E2E
        run: |
          python -m pip install --upgrade pip
          pip install -e ./backend pytest httpx uvicorn

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: |
          cd frontend
          npx playwright test
